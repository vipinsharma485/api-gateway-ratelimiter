server:
  port: 8081

spring:
  application:
    name: product-service

# Phase 6 - distributed tracing exported to Jaeger via OTLP.
management:
  tracing:
    sampling:
      probability: 1.0          # sample 100% in dev; lower this in production
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
