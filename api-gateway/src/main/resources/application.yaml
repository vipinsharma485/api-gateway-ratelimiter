server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    reactor.netty: DEBUG

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-route
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/products,/api/products/**
              filters:
                - RewritePath=/api/products(?<segment>/?.*), /products$\{segment}
                - name: CircuitBreaker                 # Phase 5: trip on downstream failures/timeouts
                  args:
                    name: productCircuitBreaker
                    fallbackUri: forward:/fallback/products
                # --- Built-in token bucket (Spring Cloud Gateway RequestRateLimiter) ----
                # DISABLED. Superseded by the Phase 4 sliding-window limiter (production)
                # and left here, commented, as a reference alternative.
                # To use it: uncomment this block and set both
                # rate-limiter.sliding-window.enabled and fixed-window.enabled to false.
                #- name: RequestRateLimiter           # the built-in, Redis-backed limiter
                #  args:
                #    redis-rate-limiter.replenishRate: 2    # refill 2 tokens/sec (steady rate)
                #    redis-rate-limiter.burstCapacity: 5    # bucket holds up to 5 (max burst)
                #    redis-rate-limiter.requestedTokens: 1  # each request costs 1 token
                #    key-resolver: "#{@userKeyResolver}"    # use the bean above
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Custom rate limiters. Phase 4 sliding window is the production limiter; the
# Phase 3 fixed window is kept disabled for comparison. Enable only one at a time.
rate-limiter:
  # Phase 3 - fixed-window counter (atomic INCR + EXPIRE). Disabled by default;
  # demonstrates the boundary-burst limitation that the sliding window fixes.
  fixed-window:
    enabled: false          # set true (and sliding-window.enabled false) to use it
    window-size-ms: 60000   # 1 minute
    max-requests: 10        # per window per client IP
  # Phase 4 - sliding-window log via atomic Lua script (production limiter).
  sliding-window:
    enabled: true           # set false to disable both bean + filter
    window-size-ms: 60000   # 1 minute
    max-requests: 10        # per window per client IP

resilience4j:
  circuitbreaker:
    instances:
      productCircuitBreaker:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5                   # need 5 calls before judging the rate
        failure-rate-threshold: 50                   # open once >= 50% of recent calls fail
        wait-duration-in-open-state: 10s             # stay open 10s, then probe (half-open)
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    instances:
      productCircuitBreaker:
        timeout-duration: 3s                         # a slow downstream counts as a failure
        cancel-running-future: true
